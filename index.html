<script>
'use strict';
// ======================= parameters & constants =======================
const P={seed:1954,dens:.6,slope:.24,loops:.3,branch:.6,S:120,wall:true,parapet:true,lots:false,bld:true};
const RISE=.16,GMAX=.5,GRAMP=.07,STEP=.17;          // riser target, max stair grade, ramp→stair threshold, door step
// street hierarchy: width, A* clearance (room for two lot depths between parallel streets), grade weights
const CLS=[{n:'شارع',w:3.6,v:.1,clr:9,kG:3,kS:.35},{n:'زقاق',w:2.4,v:.16,clr:8,kG:2.5,kS:.25},{n:'درب',w:1.6,v:.18,clr:6,kG:1.6,kS:.1}];

let R=Math.random,ph1=0,ph2=0,ph3=0;

// ======================= terrain: hillside amphitheatre facing the sea (north = -z) =======================
const noise=(x,z)=>Math.sin(x*.11+ph1)*Math.cos(z*.09+ph2)+.5*Math.sin(x*.23+z*.17+ph3)+.25*Math.sin(x*.41-z*.37+ph1*2);
function H(x,z){const S=P.S,t=z+S*.5;
 if(t<0)return Math.max(-3,.6+t*.35);
 const tt=Math.min(t,S*1.15)+Math.max(0,t-S*1.15)*.3;
 let h=.6+P.slope*tt*(1+.1*Math.sin(x*.035+ph1))+noise(x,z)*Math.min(1,t/12);
 h+=P.slope*S*.05*Math.cos(Math.min(1,Math.abs(x)/(S*.8))*Math.PI/2)*Math.min(1,t/30); // gentle spur
 h-=P.slope*S*.08*sstep(S*.48,S*.8,Math.abs(x))*Math.min(1,t/25);                    // side ravines
 return h}

// ======================= polygon helpers =======================
function pinside(poly,x,z){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>z)!==(b[1]>z)&&x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function segD(px,pz,ax,az,bx,bz){const dx=bx-ax,dz=bz-az,l=dx*dx+dz*dz,t=l?clamp(((px-ax)*dx+(pz-az)*dz)/l,0,1):0;return Math.hypot(px-ax-dx*t,pz-az-dz*t)}
function psd(poly,x,z){let d=1e9;for(let i=0,j=poly.length-1;i<poly.length;j=i++)d=Math.min(d,segD(x,z,poly[j][0],poly[j][1],poly[i][0],poly[i][1]));return pinside(poly,x,z)?d:-d}
function dp(pts,tol){if(pts.length<3)return pts.slice();const a=pts[0],b=pts[pts.length-1];let mx=-1,mi=0;
 for(let i=1;i<pts.length-1;i++){const d=segD(pts[i][0],pts[i][1],a[0],a[1],b[0],b[1]);if(d>mx){mx=d;mi=i}}
 if(mx<=tol)return [a,b];const l=dp(pts.slice(0,mi+1),tol),r=dp(pts.slice(mi),tol);return l.slice(0,-1).concat(r)}
function catmull(P,step){ // centripetal Catmull-Rom → dense polyline
 const n=P.length;if(n<2)return P.slice();const out=[];
 const ex=(a,b)=>[2*a[0]-b[0],2*a[1]-b[1]];
 for(let i=0;i<n-1;i++){const p0=i>0?P[i-1]:ex(P[0],P[1]),p1=P[i],p2=P[i+1],p3=i<n-2?P[i+2]:ex(P[n-1],P[n-2]);
  const tj=(a,b)=>Math.max(1e-4,Math.pow(Math.hypot(b[0]-a[0],b[1]-a[1]),.5));
  const t0=0,t1=t0+tj(p0,p1),t2=t1+tj(p1,p2),t3=t2+tj(p2,p3),m=Math.max(2,Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/step));
  for(let k=0;k<m;k++){const t=t1+(t2-t1)*k/m,L=(a,b,ta,tb)=>[(tb-t)/(tb-ta)*a[0]+(t-ta)/(tb-ta)*b[0],(tb-t)/(tb-ta)*a[1]+(t-ta)/(tb-ta)*b[1]];
   const A1=L(p0,p1,t0,t1),A2=L(p1,p2,t1,t2),A3=L(p2,p3,t2,t3),B1=L(A1,A2,t0,t2),B2=L(A2,A3,t1,t3);out.push(L(B1,B2,t1,t2))}}
 out.push(P[n-1]);return out}
function resample(pl,ds){const out=[{x:pl[0][0],z:pl[0][1]}];let acc=0;
 for(let i=1;i<pl.length;i++){let ax=pl[i-1][0],az=pl[i-1][1];const bx=pl[i][0],bz=pl[i][1];let l=Math.hypot(bx-ax,bz-az);
  while(acc+l>=ds){const t=(ds-acc)/l;ax=ax+(bx-ax)*t;az=az+(bz-az)*t;out.push({x:ax,z:az});l=Math.hypot(bx-ax,bz-az);acc=0}acc+=l}

const segX=(a,b,c,d)=>{const o=(p,q,r)=>(q.x-p.x)*(r.z-p.z)-(q.z-p.z)*(r.x-p.x);return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0};

// ======================= renderer / scene =======================
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();const SKY=new THREE.Color(0x9cc3e6);scene.background=SKY;scene.fog=new THREE.Fog(SKY.clone().convertSRGBToLinear(),200,520);
const cam=new THREE.PerspectiveCamera(48,1,.2,1600);
scene.add(new THREE.HemisphereLight(0xe8f1ff,0x8f7d5c,.75));
const sun=new THREE.DirectionalLight(0xffeed6,1.45);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);sun.shadow.bias=-.0003;sun.shadow.normalBias=.035;scene.add(sun);scene.add(sun.target);
const controls=new THREE.OrbitControls(cam,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=Math.PI*.495;controls.screenSpacePanning=false;
const MAXANI=renderer.capabilities.getMaxAnisotropy();

// ======================= procedural PBR textures (albedo + normal + roughness, tileable) =======================
const TX=(()=>{
 const vn=(x,y,p,s)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),m=a=>((a%p)+p)%p;
  const a=ihash(m(xi),m(yi),s),b=ihash(m(xi+1),m(yi),s),c=ihash(m(xi),m(yi+1),s),d=ihash(m(xi+1),m(yi+1),s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
 const fbm=(u,v,p,s,o=3)=>{let t=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){t+=a*vn(u*p*f,v*p*f,p*f,s+i*31);n+=a;a*=.5;f*=2}return t/n};
 let F1=0,F2=0,FID=0;
 const vor=(u,v,n,s,jit,ax=1)=>{const x=u*n,y=v*n,xi=Math.floor(x),yi=Math.floor(y);F1=F2=9;
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const cx=xi+i,cy=yi+j,wx=((cx%n)+n)%n,wy=((cy%n)+n)%n;
   const dx=(cx+.5+(ihash(wx,wy,s)-.5)*jit-x)*ax,dy=cy+.5+(ihash(wx,wy,s+7)-.5)*jit-y,d=Math.hypot(dx,dy);
   if(d<F1){F2=F1;F1=d;FID=wy*n+wx}else if(d<F2)F2=d}};
 function make(N,fn,ns){const al=new Uint8ClampedArray(N*N*4),h=new Float32Array(N*N),ro=new Uint8ClampedArray(N*N*4),o={r:0,g:0,b:0,h:0,ro:1};
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){fn((x+.5)/N,(y+.5)/N,o);const i=y*N+x;al[i*4]=o.r*255;al[i*4+1]=o.g*255;al[i*4+2]=o.b*255;al[i*4+3]=255;h[i]=o.h;ro[i*4]=ro[i*4+1]=ro[i*4+2]=o.ro*255;ro[i*4+3]=255}
  const nm=new Uint8ClampedArray(N*N*4),g=(x,y)=>h[((y+N)%N)*N+((x+N)%N)],k=ns*N/512;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const dx=(g(x+1,y)-g(x-1,y))*k,dy=(g(x,y+1)-g(x,y-1))*k,l=Math.hypot(dx,dy,1),i=(y*N+x)*4;
   nm[i]=(-dx/l*.5+.5)*255;nm[i+1]=(dy/l*.5+.5)*255;nm[i+2]=(1/l*.5+.5)*255;nm[i+3]=255}
  const T=(d,srgb)=>{const c=document.createElement('canvas');c.width=c.height=N;c.getContext('2d').putImageData(new ImageData(d,N,N),0,0);
   const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=MAXANI;if(srgb)t.encoding=THREE.sRGBEncoding;return t};
  return{a:T(al,true),n:T(nm),r:T(ro)}}
 const mix3=(o,c,k)=>{o.r=lerp(o.r,c[0],k);o.g=lerp(o.g,c[1],k);o.b=lerp(o.b,c[2],k)};
 // calade: river cobbles set in lime/sand, with a dressed transverse band (pas d'âne edge) every tile (1.6 m)
 const cobble=make(1024,(u,v,o)=>{const band=.085;
  if(v<band){const k=Math.floor(u*6),fu=u*6-k,fv=v/band,e=Math.min(Math.min(fu,1-fu)*.267,Math.min(fv,1-fv)*.136),m=sstep(.003,.012,e),t=.86+.22*ihash(k,1,5),w=fbm(u,v,8,3);
   o.r=lerp(.5,.8*t,m)*(.9+.2*w);o.g=lerp(.45,.73*t,m)*(.9+.2*w);o.b=lerp(.37,.6*t,m)*(.9+.2*w);o.h=m*(.68+.2*w);o.ro=m?.62:.95;return}
  vor(u,v,12,11,.85);const e=F2-F1,m=sstep(.05,.15,e),dome=Math.max(0,1-F1*F1*1.3),q=ihash(FID,2,9),t=.82+.3*ihash(FID,3,9),w=fbm(u,v,16,5);
  const pal=q<.3?[.5,.52,.53]:q<.6?[.66,.6,.5]:q<.85?[.56,.46,.36]:[.4,.39,.37];
  const mo=[.47,.42,.35].map(c=>c*(.8+.35*w));o.r=lerp(mo[0],pal[0]*t*(.9+.2*w),m);o.g=lerp(mo[1],pal[1]*t*(.9+.2*w),m);o.b=lerp(mo[2],pal[2]*t*(.9+.2*w),m);
  const ed=.72+.28*sstep(.05,.3,e);o.r*=ed;o.g*=ed;o.b*=ed;o.h=m*(.4+.6*dome)*(.85+.3*q)+w*.06;o.ro=m?lerp(.42,.7,w):.96},2.4);
 // dressed limestone slabs in courses of varying height (dalles); options: rows, equal rows, palette
 function slabs(N,rows,eq,pal,seed,lenMin,lenMax,ns,wear){const ry=[0];for(let r=0;r<rows;r++)ry.push(ry[r]+(eq?1:.6+.8*ihash(r,seed,1)));const tot=ry[rows];for(let r=0;r<=rows;r++)ry[r]/=tot;
  const cols=[];for(let r=0;r<rows;r++){const b=[0];let u=0;while(u<1){const l=lenMin+(lenMax-lenMin)*ihash(r,b.length,seed+3);if(1-u-l<lenMin*.7){u=1}else u+=l;b.push(Math.min(1,u))}cols.push({b,off:ihash(r,seed,9)})}

   const ev=Math.min(v-ry[r],ry[r+1]-v),eu=Math.min(uu-C.b[k],C.b[k+1]-uu),e=Math.min(ev,eu),m=sstep(.002,.008,e),bev=sstep(.0,.02,e);

   o.h=m*(.55+.25*bev)+w*wear;o.ro=m?lerp(.5,.8,w):.95},ns)}
 const flag=slabs(1024,6,false,[.78,.72,.62],21,.14,.32,1.6,.12);
 const tread=slabs(512,5,false,[.8,.75,.66],33,.2,.5,1.4,.08);
 const riser=slabs(512,10,true,[.74,.68,.58],45,.18,.42,1.2,.1);
 const gutter=slabs(256,4,true,[.56,.55,.52],57,1.1,1.2,1.4,.06);
 // moellons: rubble retaining-wall masonry, lime mortar and worn lime-wash patches
 const rubble=make(1024,(u,v,o)=>{vor(u,v,7,71,.9,.62);const e=F2-F1,m=sstep(.07,.17,e),dome=Math.max(0,1-F1*F1*1.6),q=ihash(FID,5,71),t=.8+.3*ihash(FID,6,71),w=fbm(u,v,12,72);
  const pal=q<.4?[.66,.6,.5]:q<.75?[.58,.52,.43]:[.52,.5,.47];const mo=[.76,.72,.64];
  o.r=lerp(mo[0],pal[0]*t*(.88+.24*w),m);o.g=lerp(mo[1],pal[1]*t*(.88+.24*w),m);o.b=lerp(mo[2],pal[2]*t*(.88+.24*w),m);
  o.h=m*(.45+.55*dome)+w*.08;const ww=sstep(.56,.72,fbm(u,v,3,73,4));mix3(o,[.93,.91,.86],ww*.85);o.h=lerp(o.h,.55+o.h*.25,ww*.65);o.ro=.9},2.6);
 // ردم: compacted fill (tuf) with gravel
 const fill=make(512,(u,v,o)=>{const w=fbm(u,v,8,81,4),w2=fbm(u,v,24,82);vor(u,v,40,83,.9);const peb=ihash(FID,1,83)<.45&&F1<.32;
  o.r=lerp(.6,.5,w)*(.9+.2*w2);o.g=lerp(.49,.4,w)*(.9+.2*w2);o.b=lerp(.35,.29,w)*(.9+.2*w2);o.h=.3+w2*.25;o.ro=.97;
  if(peb){const t=.7+.5*ihash(FID,2,83),k=1-F1/.32;mix3(o,[.72*t,.68*t,.6*t],sstep(0,.25,k));o.h=.5+.45*k;o.ro=.8}
  const cr=Math.abs(fbm(u,v,5,84,4)-.5);if(cr<.008){o.r*=.7;o.g*=.7;o.b*=.7;o.h-=.2}},1.8);

  const d=sstep(.6,.8,fbm(u,v,3,93,3));o.r-=d*.12;o.g-=d*.13;o.b-=d*.15;o.h=w*.5+w2*.25;o.ro=.88},.7);
 const terr=make(512,(u,v,o)=>{const g=fbm(u,v,6,101,4),w2=fbm(u,v,40,102);vor(u,v,60,103,.9);
  const soil=[.55,.46,.34],dry=[.62,.6,.4],grn=[.36,.45,.24];const k=sstep(.42,.62,g);o.r=lerp(soil[0],dry[0],k);o.g=lerp(soil[1],dry[1],k);o.b=lerp(soil[2],dry[2],k);
  if(ihash(FID,1,103)<.3&&F1<.3)mix3(o,grn,.7);const t=.88+.24*w2;o.r*=t;o.g*=t;o.b*=t;o.h=g*.5+w2*.3;o.ro=.97},1);
 // جير: whitewash over lime render — trowel waves, chipped top coats showing ochre under-layers, hairline cracks (tile 2.5 m)
 const limeFn=(u,v,o,k=0)=>{const w=fbm(u,v,4,111,4),w2=fbm(u,v,32,112,2),ch=fbm(u,v,5,114,4),cz=fbm(u,v,2,115,2);

 const nr=g.attributes.normal.array;for(let k=0;k<n*n;k++){const x=pos[k*3],z=pos[k*3+2];if(Math.abs(x)<P.S*.6&&Math.abs(z)<P.S*.6&&psd(poly,x,z)>-1.2){col[k*3]=.82;col[k*3+1]=.72;col[k*3+2]=.6;continue}const y=pos[k*3+1],ny=nr[k*3+1],rock=sstep(.86,.7,ny),sand=sstep(1.2,.4,y);let c=[lerp(.86,.72,rock),lerp(.9,.68,rock),lerp(.7,.6,rock)];
  c=[lerp(c[0],1,sand),lerp(c[1],.92,sand),lerp(c[2],.78,sand)];const vv=.86+.14*Math.sin(x*.043+ph1)*Math.cos(z*.051+ph2)+.07*Math.sin(x*.13-z*.11);c=c.map(q=>q*vv);col[k*3]=c[0];col[k*3+1]=c[1];col[k*3+2]=c[2]}
 g.setAttribute('color',new THREE.BufferAttribute(col,3));const m=new THREE.Mesh(g,MAT.terr);m.receiveShadow=true;m.castShadow=true;group.add(m);
 const sea=new THREE.Mesh(new THREE.PlaneGeometry(ext*4,ext*2),MSEA);sea.rotation.x=-Math.PI/2;sea.position.set(0,-.35,-S*.5-ext*1);sea.receiveShadow=true;group.add(sea)}
function buildRampart(){const gb=new GB,n=poly.length,th=1.6,gw=nodes.filter(q=>(q.kind==='gate'||q.kind==='plaza')&&q.deg);
 const C=[0,0];poly.forEach(p=>{C[0]+=p[0]/n;C[1]+=p[1]/n});
 const out=poly.map((p,i)=>{const a=poly[(i-1+n)%n],b=poly[(i+1)%n];let nx=b[1]-a[1],nz=-(b[0]-a[0]);const l=Math.hypot(nx,nz)||1;nx/=l;nz/=l;if(nx*(p[0]-C[0])+nz*(p[1]-C[1])<0){nx=-nx;nz=-nz}return[nx,nz]});
 let top=poly.map((p,i)=>Math.max(Gat(p[0]-out[i][0]*.8,p[1]-out[i][1]*.8),H(p[0]+out[i][0]*(th+.6),p[1]+out[i][1]*(th+.6)))+3.4);
 for(let it=0;it<3;it++)top=top.map((t,i)=>(top[(i-1+n)%n]+2*t+top[(i+1)%n])/4);
 const bot=poly.map((p,i)=>Math.min(Gat(p[0]-out[i][0]*.8,p[1]-out[i][1]*.8),H(p[0]+out[i][0]*(th+.6),p[1]+out[i][1]*(th+.6)))-2.5);
 const open=i=>{const p=poly[i];return gw.some(g=>Math.hypot(g.x-p[0],g.z-p[1])<g.r+2.2)};
 const c=[1,.93,.82],segOpen=poly.map((_,i)=>open(i)||open((i+1)%n)),runLen=new Float32Array(n);
 for(let i=0;i<n;i++){if(segOpen[i]||runLen[i])continue;let k=i;while(!segOpen[(k-1+n)%n]&&(k-1+n)%n!==i)k=(k-1+n)%n;const run=[];let L2=0;for(let q=k;!segOpen[q]&&run.length<n;q=(q+1)%n){run.push(q);L2+=Math.hypot(poly[(q+1)%n][0]-poly[q][0],poly[(q+1)%n][1]-poly[q][1])}run.forEach(q=>runLen[q]=L2||1e-3)}
 let per=0;
 for(let i=0;i<n;i++){const j=(i+1)%n,a=poly[i],b=poly[j],l=Math.hypot(b[0]-a[0],b[1]-a[1]),u0=per/2.6,u1=(per+l)/2.6;per+=l;if(segOpen[i]||runLen[i]<6)continue;
  const ao=[a[0]+out[i][0]*th,a[1]+out[i][1]*th],bo=[b[0]+out[j][0]*th,b[1]+out[j][1]*th];
  gb.quad(V(a[0],top[i],a[1],u0,top[i]/2.6,c),V(b[0],top[j],b[1],u1,top[j]/2.6,c),V(b[0],bot[j],b[1],u1,bot[j]/2.6,sh(c,.8)),V(a[0],bot[i],a[1],u0,bot[i]/2.6,sh(c,.8)));
  gb.quad(V(ao[0],top[i],ao[1],u0,top[i]/2.6,c),V(bo[0],top[j],bo[1],u1,top[j]/2.6,c),V(bo[0],bot[j],bo[1],u1,bot[j]/2.6,sh(c,.8)),V(ao[0],bot[i],ao[1],u0,bot[i]/2.6,sh(c,.8)));
  gb.quad(V(a[0],top[i],a[1],u0,0,c),V(b[0],top[j],b[1],u1,0,c),V(bo[0],top[j],bo[1],u1,.6,c),V(ao[0],top[i],ao[1],u0,.6,c));
  for(const [k,q] of [[i,open((i-1+n)%n)],[j,open((j+1)%n)]])if(q){const p=poly[k],po2=[p[0]+out[k][0]*th,p[1]+out[k][1]*th];gb.quad(V(p[0],top[k],p[1],0,top[k]/2.6,c),V(po2[0],top[k],po2[1],.6,top[k]/2.6,c),V(po2[0],bot[k],po2[1],.6,bot[k]/2.6,c),V(p[0],bot[k],p[1],0,bot[k]/2.6,c))}}
 rampartGroup=new THREE.Group();group.add(rampartGroup);gb.mesh(MAT.rampart,rampartGroup);rampartGroup.visible=P.wall}

// ======================= generation driver =======================
function gen(){const t0=performance.now();R=mul(P.seed);ph1=R()*6.28;ph2=R()*6.28;ph3=R()*6.28;stats={};
 if(group){scene.remove(group);group.traverse(o=>{if(o.geometry)o.geometry.dispose()})}group=new THREE.Group();scene.add(group);
 poly=makeRampartPoly();synth();levels();FG=fineGrid();makeLots();
 buildTerrain();buildRoads();buildLots();buildHouses();buildRampart();buildTour();fit();
 const nm={};group.traverse(o=>{if(o.isMesh&&!o.name){const b=(Array.isArray(o.material)?o.material[0]:o.material).name.replace(/^M_/,'')||'Mesh';nm[b]=(nm[b]||0)+1;o.name=`${b}_${nm[b]}`}});group.name='Casbah';
 const len=[0,0,0];edges.forEach(e=>len[e.cls]+=e.L);const dead=nodes.filter(n=>!n.dead&&n.deg===1&&n.kind==='end').length,bl=lots.filter(l=>l.buildable);
 document.getElementById('st').textContent=`شوارع ${len[0]|0} م · أزقة ${len[1]|0} م · دروب ${len[2]|0} م (${dead} مسدود) · ${stats.steps} درجة في ${stats.flights} قلبة · ${bl.length} قطعة بناء (${bl.reduce((s,l)=>s+l.area,0)|0} م²) + ${lots.length-bl.length} فضلة · ${stats.houses} دار (${stats.floors} طابق) · ردم ${stats.fill|0} م³ / حفر ${stats.cut|0} م³ · ${Math.round(performance.now()-t0)} ms`;
 exposeAPI()}
function buildTour(){const adj=nodes.map(()=>[]);edges.forEach(e=>{adj[e.a].push([e,e.b]);adj[e.b].push([e,e.a])});
 const src=gates.T,dst=gates.B,d=nodes.map(()=>Infinity),pv=nodes.map(()=>null);d[src]=0;const Q=new Set([src]);
 while(Q.size){let u=-1,bv=Infinity;for(const q of Q)if(d[q]<bv){bv=d[q];u=q}Q.delete(u);if(u===dst)break;for(const [e,v] of adj[u])if(d[u]+e.L<d[v]){d[v]=d[u]+e.L;pv[v]=[e,u];Q.add(v)}}
 tourPts=[];const seq=[];for(let v=dst;pv[v];v=pv[v][1])seq.unshift(pv[v]);
 for(const [e,u] of seq){const w=e.a===u?e.walk:e.walk.slice().reverse();tourPts.push(...w)}}

// ======================= API for later building placement =======================
function exposeAPI(){window.CASBAH={params:Object.assign({},P),
 nodes:nodes.filter(n=>!n.dead&&n.deg).map(n=>({id:n.id,kind:n.kind,name:n.name||null,x:+n.x.toFixed(3),y:+n.h.toFixed(3),z:+n.z.toFixed(3),radius:+n.r.toFixed(2),degree:n.deg})),
 roads:edges.map(e=>({id:e.id,class:['primary','alley','derb'][e.cls],width:CLS[e.cls].w,from:e.a,to:e.b,length:+e.L.toFixed(2),centerline:e.walk.filter((_,i)=>i%2===0).map(p=>[+p.x.toFixed(3),+p.y.toFixed(3),+p.z.toFixed(3)]),
  flights:e.runs.filter(r=>r.t===1).map(r=>({from:+r.s0.toFixed(2),to:+Math.min(r.s1,e.L).toFixed(2),risers:r.ris.length,rise:+Math.abs(r.rise).toFixed(3)}))})),
 lots:lots.map(L=>({id:L.id,buildable:L.buildable,area:+L.area.toFixed(2),padY:+L.pad.toFixed(3),centroid:[+L.c[0].toFixed(3),+L.c[1].toFixed(3)],polygon:L.poly.map(q=>[+q[0].toFixed(3),+q[1].toFixed(3)]),
  door:{x:+L.seed.x.toFixed(3),z:+L.seed.z.toFixed(3),streetY:+L.seed.dy.toFixed(3),inward:[+L.seed.dir[0].toFixed(4),+L.seed.dir[1].toFixed(4)],road:L.seed.e,roadClass:['primary','alley','derb'][L.seed.cls],steps:L.steps},building:L.house||null})),
 heightAt:(x,z)=>Gat(x,z),
  lotAt(x,z){const L=lots.find(L=>pinside(L.poly,x,z));return L?L.id:null},
 // origin on the pad at the door, +z of the frame pointing into the lot (building front faces the street)
 lotFrame(id){const L=lots[id];if(!L)return null;const s=L.seed;return{origin:[s.x,L.pad,s.z],yaw:Math.atan2(s.dir[0],s.dir[1]),polygon:L.poly,padY:L.pad}},
 placeOnLot(id,obj){const f=this.lotFrame(id);if(!f)return false;obj.position.set(f.origin[0],f.origin[1],f.origin[2]);obj.rotation.set(0,f.yaw,0);group.add(obj);return true},
 three:{THREE,scene,group}}}

// ======================= camera, views, tour, UI =======================
function fit(){const S=P.S,k=S*.75;Object.assign(sun.shadow.camera,{left:-k,right:k,top:k,bottom:-k,near:1,far:S*4});sun.shadow.camera.updateProjectionMatrix();
 sun.position.set(S*.55,S*.95,S*.25);sun.target.position.set(0,S*.08,0);scene.fog.near=S*1.6;scene.fog.far=S*4.2;controls.maxDistance=S*2.6;view('a')}
function view(v){stopTour();const S=P.S;let t,p;
 if(v==='t'){t=[0,S*.1,0];p=[0,S*1.45,-S*.02]}
 else if(v==='p'){const n=nodes[gates.B];t=[n.x,n.h+1,n.z];p=[n.x+10,n.h+9,n.z-15]}
 else if(v==='h'){const n=nodes[gates.T];t=[n.x,n.h-S*.1,n.z-S*.35];p=[n.x+4,n.h+6,n.z+7]}
 else{t=[0,S*.11,-S*.02];p=[S*.42,S*.55,-S*.95]}
 controls.target.set(...t);cam.position.set(...p);controls.update()}
let tour=false,tourT=0,rot=false;const keys=new Set();
function stopTour(){tour=false;controls.enabled=true;document.getElementById('tr').textContent='🚶 جولة'}
function samplePath(t){let acc=0;for(let i=1;i<tourPts.length;i++){const a=tourPts[i-1],b=tourPts[i],l=Math.hypot(b.x-a.x,b.z-a.z);if(acc+l>=t){const u=l?(t-acc)/l:0;return new THREE.Vector3(lerp(a.x,b.x,u),lerp(a.y,b.y,u),lerp(a.z,b.z,u))}acc+=l}const z=tourPts[tourPts.length-1];return new THREE.Vector3(z.x,z.y,z.z)}
document.getElementById('tr').onclick=()=>{if(tour){stopTour();return}if(tourPts.length<2)return;tour=true;tourT=0;controls.enabled=false;document.getElementById('tr').textContent='⏹ إيقاف'};
document.getElementById('ro').onclick=()=>{rot=!rot;controls.autoRotate=rot;controls.autoRotateSpeed=.6};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
const ray=new THREE.Raycaster();renderer.domElement.addEventListener('dblclick',e=>{ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam);const h=ray.intersectObjects(group.children,true)[0];if(h){const d=h.point.clone().sub(controls.target);controls.target.add(d);cam.position.add(d.multiplyScalar(.6))}});
addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;keys.add(e.key.toLowerCase())});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
const $=id=>document.getElementById(id);let tmr=0;
function rebuild(){clearTimeout(tmr);tmr=setTimeout(()=>{Object.assign(P,{seed:+$('sd').value|0,dens:+$('dn').value,slope:+$('sl').value,loops:+$('lp').value,branch:+$('br').value,S:+$('sz').value});
 $('busy').style.display='flex';setTimeout(()=>{try{gen()}catch(err){console.error(err);$('st').textContent='خطأ في التوليد: '+err.message}$('busy').style.display='none'},30)},200)}
['sd','dn','sl','lp','br','sz'].forEach(id=>$(id).addEventListener('change',rebuild));
$('rd').onclick=()=>{$('sd').value=Math.random()*1e5|0;rebuild()};
$('wl').onchange=e=>{P.wall=e.target.checked;if(rampartGroup)rampartGroup.visible=P.wall};
$('pp').onchange=e=>{P.parapet=e.target.checked;if(parapetGroup)parapetGroup.visible=P.parapet};
$('bd').onchange=e=>{P.bld=e.target.checked;if(bldGroup)bldGroup.visible=P.bld};
// glTF 2.0 binary, metres, Y-up: Unreal's Interchange importer converts to cm / Z-up; helpers (lot outlines, door markers) are left out
$('xg').onclick=()=>{const onlyB=$('xs').value==='b',root=onlyB?bldGroup:group;if(!root||typeof THREE.GLTFExporter!=='function')return;
 const lv=lotLines.visible,bv=bldGroup.visible,msg=$('busy').textContent;lotLines.visible=false;bldGroup.visible=true;$('busy').textContent='… جاري تصدير GLB';$('busy').style.display='flex';
 const done=()=>{lotLines.visible=lv;bldGroup.visible=bv;$('busy').style.display='none';$('busy').textContent=msg};
 setTimeout(()=>{try{new THREE.GLTFExporter().parse(root,glb=>{done();const b=new Blob([glb],{type:'model/gltf-binary'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`casbah-${P.seed}${onlyB?'-buildings':''}.glb`;a.click()},{binary:true,onlyVisible:true,maxTextureSize:2048})}catch(err){done();console.error(err);$('st').textContent='خطأ في التصدير: '+err.message}},30)};
$('lt').onchange=e=>{P.lots=e.target.checked;if(lotLines)lotLines.visible=P.lots};
$('ex').onclick=()=>{const d=Object.assign({},window.CASBAH);delete d.three;const b=new Blob([JSON.stringify(d)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`casbah-${P.seed}.json`;a.click()};
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let last=performance.now();
(function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
 if(tour&&tourPts.length>1){tourT+=dt*3.2;const p=samplePath(tourT),q=samplePath(tourT+5);cam.position.set(p.x,p.y+1.65,p.z);cam.lookAt(q.x,q.y+1.3,q.z);controls.target.copy(q);
  let tot=0;for(let i=1;i<tourPts.length;i++)tot+=Math.hypot(tourPts[i].x-tourPts[i-1].x,tourPts[i].z-tourPts[i-1].z);if(tourT>tot)stopTour()}
 else{if(keys.size){const f=new THREE.Vector3();cam.getWorldDirection(f);f.y=0;f.normalize();const r=new THREE.Vector3(-f.z,0,f.x),sp=cam.position.distanceTo(controls.target)*dt*.8,m=new THREE.Vector3();
   if(keys.has('w')||keys.has('arrowup'))m.add(f);if(keys.has('s')||keys.has('arrowdown'))m.sub(f);if(keys.has('d')||keys.has('arrowright'))m.add(r);if(keys.has('a')||keys.has('arrowleft'))m.sub(r);
   m.multiplyScalar(sp);cam.position.add(m);controls.target.add(m)}controls.update()}
 renderer.render(scene,cam)})();
rebuild();
