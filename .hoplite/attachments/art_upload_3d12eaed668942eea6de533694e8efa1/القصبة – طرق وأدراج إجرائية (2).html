 tourPts.push({x:nodes[cur].x,z:nodes[cur].z,y:nodes[cur].h});
 document.getElementById('st').textContent=`${seen.size} بسطة · ${recs.length} رابط · ${steps} درجة (17 سم) · ${nw} جدار مستمر · ${leaves.length} ورقة · ${ntun} ممر مسقوف · ${recs.filter(r=>r.kd).length} شارع مرصوف · ${beams.length} عارضة خشبية · ${bl.length} بيت · رُفض: تداخل ${rj.overlap} · بسطة ${rj.landing} · مفصل ${rj.junction} · انحدار ${rj.grade}`;
}

let th=.35,ph=.9,dist=130,tgt=new THREE.Vector3(0,14,6),auto=false,tour=false,ti=0;
const cv=renderer.domElement,ptrs=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,e);dwn={x:e.clientX,y:e.clientY,t:performance.now()}});
cv.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);pd=0;
 if(dwn&&Math.hypot(e.clientX-dwn.x,e.clientY-dwn.y)<6&&performance.now()-dwn.t<300){const n=performance.now();if(n-lastTap<350){lastTap=0;focusAt(e)}else lastTap=n}});
cv.addEventListener('pointermove',e=>{const o=ptrs.get(e.pointerId);if(!o)return;
 if(ptrs.size===2){const [a,b]=[...ptrs.values()],nd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)dist=Math.min(MD,Math.max(6,dist*pd/nd));pd=nd;pan((e.clientX-o.clientX)/2,(e.clientY-o.clientY)/2)}
 else if(e.shiftKey||e.buttons===2){pan(e.clientX-o.clientX,e.clientY-o.clientY);if(tour)stopTour()}
 else{th-=(e.clientX-o.clientX)*.006;ph=Math.min(1.5,Math.max(.15,ph-(e.clientY-o.clientY)*.006));if(tour)stopTour()}
 ptrs.set(e.pointerId,e)});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.min(MD,Math.max(6,dist*(1+e.deltaY*.001)))},{passive:false});
let MD=300,goal=null,lastTap=0,dwn=null,lastS=60;const keys=new Set(),ray=new THREE.Raycaster(),fwd=()=>[-Math.sin(th),Math.cos(th)];
cv.addEventListener('contextmenu',e=>e.preventDefault());
const pan=(dx,dy)=>{const [fx,fz]=fwd(),s=dist*.0016;tgt.x+=fz*dx*s+fx*dy*s;tgt.z+=-fx*dx*s+fz*dy*s;goal=null};
function focusAt(e){ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam);
 const h=ray.intersectObjects(group.children.filter(o=>o.isMesh&&!o.isInstancedMesh))[0];if(h){goal={t:h.point.clone(),d:Math.max(18,dist*.45)};stopTour();auto=false}}
function go(t,d,nth,nph){goal={t,d};if(nth!=null)th=nth;if(nph!=null)ph=nph;stopTour();auto=false}
function fit(){const k=S/60;grid.scale.setScalar(k);Object.assign(sun.shadow.camera,{left:-95*k,right:95*k,top:95*k,bottom:-95*k,far:320*k});sun.shadow.camera.updateProjectionMatrix();
 sun.position.set(70*k,110*k,-30*k);const m=k>1?4096:2048;sun.shadow.mapSize.set(m,m);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}
 scene.fog.near=220*k;scene.fog.far=560*k;cam.far=700*k;cam.updateProjectionMatrix();MD=300*k;dist=Math.min(dist,MD)}
addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;keys.add(e.key.toLowerCase())});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const k=S/60,v=b.dataset.v;
 if(v==='a')go(new THREE.Vector3(0,14*k,6*k),130*k,.35,.9);
 if(v==='t')go(new THREE.Vector3(0,0,6*k),210*k,th,.15);
 if(v==='p')go(new THREE.Vector3(0,2,-42),42,.2,1.05);
 if(v==='h'&&tourPts.length){const q=tourPts[tourPts.length-1];go(new THREE.Vector3(q.x,q.y,q.z),30,th,1.0)}});
function stopTour(){tour=false;document.getElementById('tr').textContent='🚶 جولة'}
document.getElementById('tr').onclick=()=>{if(tour){stopTour();return}tour=true;ti=0;auto=false;document.getElementById('tr').textContent='⏹ إيقاف'};
document.getElementById('ro').onclick=()=>{auto=!auto;stopTour()};
const $=i=>document.getElementById(i),sd=$('sd'),dn=$('dn'),sl=$('sl'),lp=$('lp'),br=$('br'),sz=$('sz'),hb=$('hb'),wl=$('wl');
const rebuild=()=>{P.dens=+dn.value;P.slope=+sl.value;P.loops=+lp.value;P.branch=+br.value;P.walls=wl.checked;P.houses=hb.checked;S=+sz.value;fit();gen(+sd.value||1);ti=0;if(S!==lastS){lastS=S;document.querySelector('[data-v=a]').click()}};
sd.onchange=dn.oninput=sl.oninput=lp.oninput=br.oninput=sz.onchange=hb.onchange=wl.onchange=rebuild;
$('rd').onclick=()=>{sd.value=Math.floor(Math.random()*99999);rebuild()};
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();rebuild();
const eye=new THREE.Vector3(),look=new THREE.Vector3();
(function loop(){requestAnimationFrame(loop);
 if(tour&&tourPts.length>12){ti=Math.min(ti+.18,tourPts.length-9);const i=Math.floor(ti),f=ti-i,a=tourPts[i],b=tourPts[i+1],q=tourPts[Math.min(i+8,tourPts.length-1)];
  eye.set(a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f+1.7,a.z+(b.z-a.z)*f);look.set(q.x,q.y+1.6,q.z);
  cam.position.lerp(eye,.2);cam.lookAt(look);if(ti>=tourPts.length-9)stopTour()}
 else{if(goal){tgt.lerp(goal.t,.08);dist+=(goal.d-dist)*.08;if(tgt.distanceTo(goal.t)<.1&&Math.abs(goal.d-dist)<.5)goal=null}
  if(keys.size){const [fx,fz]=fwd(),s=dist*.01,m=c=>keys.has(c),f=(m('w')||m('arrowup'))-(m('s')||m('arrowdown')),r=(m('d')||m('arrowright'))-(m('a')||m('arrowleft'));tgt.x+=(fx*f-fz*r)*s;tgt.z+=(fz*f+fx*r)*s;goal=null}
  if(auto)th+=.002;cam.position.set(tgt.x+dist*Math.sin(ph)*Math.sin(th),tgt.y+dist*Math.cos(ph),tgt.z-dist*Math.sin(ph)*Math.cos(th));cam.lookAt(tgt)}
 renderer.render(scene,cam)})();
</script>
